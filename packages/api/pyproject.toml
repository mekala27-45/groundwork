[project]
name = "groundwork-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "groundwork-core",
    "groundwork-ingest",
    "groundwork-chunk",
    "groundwork-retrieve",
    "groundwork-generate",
    "groundwork-verify",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundwork_api"]

[tool.uv.sources]
groundwork-core = { workspace = true }
groundwork-ingest = { workspace = true }
groundwork-chunk = { workspace = true }
groundwork-retrieve = { workspace = true }
groundwork-generate = { workspace = true }
groundwork-verify = { workspace = true }
