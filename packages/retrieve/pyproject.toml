[project]
name = "groundwork-retrieve"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "groundwork-core",
    "groundwork-chunk",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.1",
    "pgvector>=0.3.5",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundwork_retrieve"]

[tool.uv.sources]
groundwork-core = { workspace = true }
groundwork-chunk = { workspace = true }
