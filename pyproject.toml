[project]
name = "groundwork-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
groundwork-core = { workspace = true }
groundwork-ingest = { workspace = true }
groundwork-chunk = { workspace = true }
groundwork-retrieve = { workspace = true }
groundwork-generate = { workspace = true }
groundwork-verify = { workspace = true }
groundwork-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B008 flags any function call in an argument default, on the assumption
# it is an accidental mutable default. FastAPI's own dependency injection
# is built on exactly that shape, Depends(...), File(...), Form(...)
# evaluated once per request by FastAPI itself, not at import time, so it
# is the documented, idiomatic way to write a route. Scoped to the two
# places that pattern actually appears rather than disabled workspace
# wide, so a real accidental-mutable-default bug elsewhere still fails.
"packages/api/src/groundwork_api/routers/*" = ["B008"]
"packages/api/src/groundwork_api/deps.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = [
    "groundwork_core", "groundwork_ingest", "groundwork_chunk",
    "groundwork_retrieve", "groundwork_generate", "groundwork_verify", "groundwork_api",
]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "packages/core/src:packages/ingest/src:packages/chunk/src:packages/retrieve/src:packages/generate/src:packages/verify/src:packages/api/src"
exclude = ["tests/fixtures", "alembic/versions", "web/"]

[[tool.mypy.overrides]]
module = [
    "pymupdf.*",
    "fitz.*",
    "pdfplumber.*",
    "pytesseract.*",
    "pdf2image.*",
    "sentence_transformers.*",
    "litellm.*",
    "PIL.*",
    "sklearn.*",
    "scipy.*",
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pymupdf's C extension ships no type stubs, so every call into it looks
# "untyped" to strict mode no matter how the caller annotates its own
# signature. Relaxed only for the two modules that touch it directly;
# every other module in the workspace keeps full strict checking.
module = ["groundwork_ingest.extract", "groundwork_ingest.fixtures"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests", "packages"]
markers = [
    "requires_local_model: needs a downloaded local model (network access to huggingface.co)",
    "requires_tesseract: needs the tesseract binary",
    "requires_postgres: needs a real Postgres with pgvector",
]
asyncio_mode = "auto"

# A known coverage.py limitation, not a gap in this suite: in
# groundwork_api's routers, the statement immediately after an awaited
# SQLAlchemy AsyncSession call (a return or a raise) is sometimes reported
# missing even when a passing test exercises exactly that line and asserts
# on its result. SQLAlchemy's asyncio support bridges to Core's
# synchronous execution model with a greenlet switch on every await
# (regardless of driver, asyncpg included), and coverage.py's tracer can
# lose attribution across that switch; see nedbat/coveragepy#1082 and
# #1240, both open against the current 7.16.1 with no config (concurrency
# = greenlet or thread,greenlet, forcing COVERAGE_CORE=ctrace) found to
# resolve this exact FastAPI-plus-async-SQLAlchemy shape. Verified directly
# in this repo, not assumed: packages/api/tests/test_conversations_router.py's
# tests were temporarily instrumented with a print before each line
# routers/conversations.py's coverage report called missing, and every one
# printed on every run that was supposed to reach it. Treat a small
# "missing" tail on a router file as this artifact before writing another
# test to chase it: the real signal is whether a passing test's own
# assertions already depend on that line's result, not the percentage.
[tool.coverage.run]
branch = true
source = ["packages"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "httpx>=0.27",
]
