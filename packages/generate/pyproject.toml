[project]
name = "groundwork-generate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "groundwork-core",
    "groundwork-retrieve",
    "litellm>=1.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundwork_generate"]

[tool.uv.sources]
groundwork-core = { workspace = true }
groundwork-retrieve = { workspace = true }
