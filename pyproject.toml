[project]
name = "groundwork-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
groundwork-core = { workspace = true }
groundwork-ingest = { workspace = true }
groundwork-chunk = { workspace = true }
groundwork-retrieve = { workspace = true }
groundwork-generate = { workspace = true }
groundwork-verify = { workspace = true }
groundwork-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "groundwork_core", "groundwork_ingest", "groundwork_chunk",
    "groundwork_retrieve", "groundwork_generate", "groundwork_verify", "groundwork_api",
]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "packages/core/src:packages/ingest/src:packages/chunk/src:packages/retrieve/src:packages/generate/src:packages/verify/src:packages/api/src"
exclude = ["tests/fixtures"]

[[tool.mypy.overrides]]
module = ["fitz.*", "pdfplumber.*", "pytesseract.*", "pdf2image.*", "sentence_transformers.*", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests", "packages"]
markers = [
    "requires_local_model: needs a downloaded local model (network access to huggingface.co)",
    "requires_tesseract: needs the tesseract binary",
    "requires_postgres: needs a real Postgres with pgvector",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["packages"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "httpx>=0.27",
]
