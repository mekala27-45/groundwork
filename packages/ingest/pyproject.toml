[project]
name = "groundwork-ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "groundwork-core",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundwork_ingest"]

[tool.uv.sources]
groundwork-core = { workspace = true }
