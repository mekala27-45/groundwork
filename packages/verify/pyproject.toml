[project]
name = "groundwork-verify"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "groundwork-core",
    "groundwork-generate",
    "sentence-transformers>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundwork_verify"]

[tool.uv.sources]
groundwork-core = { workspace = true }
groundwork-generate = { workspace = true }
