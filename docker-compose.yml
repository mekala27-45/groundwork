# One command, `docker compose up`, brings up a real pgvector Postgres
# and the API together, the same pgvector/pgvector:0.6.0-pg16 image tag
# ci.yml already pins for both of its Postgres backed jobs, so "works in
# compose" and "works in CI" are the same claim rather than two images
# that happen to both call themselves Postgres 16. Not run against a real
# `docker compose up` from this sandbox: every container registry it was
# tried against during this build returned 403 (see the Dockerfile's own
# note), so this is written correctly by construction and by matching
# ci.yml's already-proven image and health check shape exactly, not
# verified end to end here. A real machine with registry access is the
# right place to confirm it once, and that confirmation belongs in
# RESULTS.md or docs/runbook.md, not assumed now. Both already disclose
# this gap in full; a real confirmation replaces the disclosure, not
# adds to it.
#
# make dev remains the faster inner loop for day to day work (native
# Postgres, uv sync, no image build on every change); this file is for a
# reviewer with nothing installed but Docker, and for a close local
# approximation of the actual Fly plus Neon shape.

services:
  postgres:
    image: pgvector/pgvector:0.6.0-pg16
    environment:
      POSTGRES_PASSWORD: groundwork_dev_password
      POSTGRES_DB: groundwork_dev
    ports:
      - "5432:5432"
    volumes:
      - groundwork_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GROUNDWORK_DATABASE_URL: postgresql+psycopg://postgres:groundwork_dev_password@postgres:5432/groundwork_dev
      GROUNDWORK_LOG_LEVEL: INFO
      GROUNDWORK_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    # The image ships no migration step in its CMD by design (see the
    # Dockerfile's own comment on that split), so compose runs it once
    # here the same way fly.toml's release_command does in production,
    # rather than adding a second, different migration path for local use.
    command: >
      sh -c "cd packages/api && alembic upgrade head && cd /app &&
      uvicorn groundwork_api.app:app --host 0.0.0.0 --port 8000"

volumes:
  groundwork_postgres_data:
