[project]
name = "groundwork-chunk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "groundwork-core",
    "groundwork-ingest",
    "tiktoken>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/groundwork_chunk"]

[tool.uv.sources]
groundwork-core = { workspace = true }
groundwork-ingest = { workspace = true }
